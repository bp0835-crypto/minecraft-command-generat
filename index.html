<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 26.3+ 指令生成器</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #2b2b3d;
            --accent-color: #55ff55;
            --text-color: #f8f8f2;
            --border-color: #44475a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #181825;
            color: #fff;
            box-sizing: border-box;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .output-box {
            margin-top: 20px;
            background-color: #11111b;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #313244;
            word-break: break-all;
            font-family: monospace;
            color: var(--accent-color);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #a6e3a1;
            color: #11111b;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #94e2d5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Minecraft 26.3 指令生成器</h2>
    
    <div class="form-group">
        <label for="itemSelect">物品類型</label>
        <select id="itemSelect">
            <option value="netherite_sword">地獄合金劍 (netherite_sword)</option>
            <option value="diamond_sword">鑽石劍 (diamond_sword)</option>
            <option value="bow">弓 (bow)</option>
            <option value="netherite_chestplate">地獄合金胸甲 (netherite_chestplate)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="customName">自訂名稱</label>
        <input type="text" id="customName" value="管理員聖劍">
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="sharpness">鋒利等級 (Sharpness)</label>
            <input type="number" id="sharpness" value="255" min="0" max="255">
        </div>
        <div class="form-group">
            <label for="looting">掠奪等級 (Looting)</label>
            <input type="number" id="looting" value="255" min="0" max="255">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="damageAttr">攻擊力加成 (Damage)</label>
            <input type="number" id="damageAttr" value="65536">
        </div>
        <div class="form-group">
            <label for="speedAttr">攻速加成 (Speed)</label>
            <input type="number" id="speedAttr" value="255">
        </div>
    </div>

    <button onclick="generateCommand()">產生 26.3 適用指令</button>

    <div class="output-box" id="output">/give @p minecraft:netherite_sword...</div>
</div>

<script>
function generateCommand() {
    const item = document.getElementById('itemSelect').value;
    const name = document.getElementById('customName').value;
    const sharpness = parseInt(document.getElementById('sharpness').value) || 0;
    const looting = parseInt(document.getElementById('looting').value) || 0;
    const damage = parseFloat(document.getElementById('damageAttr').value) || 0;
    const speed = parseFloat(document.getElementById('speedAttr').value) || 0;

    // 建立 26.3 組件陣列
    let components = [];

    // 自訂名稱 (JSON 格式)
    if (name) {
        components.push(`custom_name='"${name}"'`);
    }

    // 附魔組件 (item_enchantments)
    let enchants = [];
    if (sharpness > 0) enchants.push(`"minecraft:sharpness":${sharpness}`);
    if (looting > 0) enchants.push(`"minecraft:looting":${looting}`);
    // 預設加上管理員專用的修補與耐久
    enchants.push(`"minecraft:unbreaking":255`, `"minecraft:mending":255`);
    
    if (enchants.length > 0) {
        components.push(`item_enchantments={levels:{${enchants.join(',')}},show_in_tooltip:true}`);
    }

    // 屬性修改器組件 (attribute_modifiers)
    let attrs = [];
    if (damage > 0) {
        attrs.push(`{type:"generic.attack_damage",amount:${damage},operation:"add_value",slot:"mainhand",id:"admin:attack_damage"}`);
    }
    if (speed > 0) {
        attrs.push(`{type:"generic.attack_speed",amount:${speed},operation:"add_value",slot:"mainhand",id:"admin:attack_speed"}`);
    }

    if (attrs.length > 0) {
        components.push(`attribute_modifiers=[${attrs.join(',')}]`);
    }

    // 組合最終指令
    const finalCommand = `/give @p minecraft:${item}[${components.join(',')}] 1`;
    document.getElementById('output').innerText = finalCommand;
}

// 頁面載入時自動執行一次
generateCommand();
</script>

</body>
</html>
